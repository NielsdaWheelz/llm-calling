[project]
name = "provider-runtime"
version = "0.1.0"
description = "Strict async runtimes for provider calls and local agent sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69,<1",
    "google-genai>=1.38,<2",
    "httpx>=0.28.0",
    "openai>=2.0,<3",
    "opentelemetry-api>=1.36,<2",
    "pydantic>=2.11,<3",
]

# Agent SDK extras use bounded constraints, not exact pins: the lockfile pins the exact
# resolution for this repo, and the runtime meets a drifted install with one warning plus a
# behavioral capability probe instead of a version hard-fail. `<1` is the honest bound for
# all three pre-1.0 upstreams — they publish frequently with no semver compatibility promise,
# so any tighter bound would be a guess restated as a contract. The one real pairing rule
# (openai-codex and its bundled runtime should match) is enforced at runtime by the probe,
# which is the only place it can be honestly checked.
[project.optional-dependencies]
codex-sdk = [
    "openai-codex>=0.144.4,<1",
    "openai-codex-cli-bin>=0.144.4,<1",
]
claude-sdk = [
    "claude-agent-sdk>=0.2.130,<1",
]
agent-sdks = [
    "openai-codex>=0.144.4,<1",
    "openai-codex-cli-bin>=0.144.4,<1",
    "claude-agent-sdk>=0.2.130,<1",
]
llm-tools = [
    "llm-tools==0.1.0",
]

[tool.uv.sources]
llm-tools = [
    { git = "https://github.com/NielsdaWheelz/llm-tools.git", rev = "8df458a199703120005296ae12f997b39d208fed", extra = "llm-tools" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provider_runtime"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "src",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -m \"not live_provider\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_provider: strict acceptance tests over live external model providers",
]
